# 项目主页 https://mcd.lzqqq.org：仓库 site/ 的静态文件，由 scripts/deploy_site.py 加内容版本号后同步到 /var/www/mcd.lzqqq.org
# 前面是 Cloudflare（SSL 模式 Full strict），所以源站要有对得上域名的证书：单独签给 mcd.lzqqq.org（webroot 验证，certbot 续期）。
# 不在源站做 http→https 跳转：Cloudflare 的「Always Use HTTPS」已经跳了，验证路径 /.well-known/acme-challenge/ 走 http 回源。

# 带内容版本号（?v=哈希）的链接内容不会变，可以长缓存；JS 里动态加载的图片和 data/*.json 没有版本号，只缓存 10 分钟（和 GitHub Pages 一样）
map $arg_v $mcd_static_cache {
    ""      "public, max-age=600";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcd.lzqqq.org;
    ssl_certificate     /etc/letsencrypt/live/mcd.lzqqq.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcd.lzqqq.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dsh-acme; }

    root /var/www/mcd.lzqqq.org;
    index index.html;
    access_log /var/log/nginx/mcd.access.log;
    error_log  /var/log/nginx/mcd.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 页面每次都向源站确认，拿到的永远是最新的版本号链接
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control $mcd_static_cache;
    }
    location /data/ {
        add_header Cache-Control "public, max-age=600";
    }
}
